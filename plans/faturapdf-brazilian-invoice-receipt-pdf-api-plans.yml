specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: FaturaPDF — Brazilian Invoice & Receipt PDF API
providerId: faturapdf-brazilian-invoice-receipt-pdf-api
generated: '2026-08-09'
method: searched
created: '2026-08-09'
modified: '2026-08-09'
tags:
  - Invoices
  - Receipts
  - PDF Generation
  - Billing
description: >-
  Four flat monthly tiers metered on documents generated, billed and enforced entirely by the
  RapidAPI marketplace. FaturaPDF runs no signup of its own, stores no customer accounts, never
  sees a payment method, and cannot adjust a subscriber's quota. Every plan — including the free
  one — has access to both endpoints and every field; tiers gate monthly volume only, with no
  per-scope permissions.
sources:
  - https://faturapdf.com/llms.txt
  - https://faturapdf.com/.well-known/api-onboarding
  - https://faturapdf.com/#pricing
  - https://rapidapi.com/leosanchees2014/api/brazilian-invoice-receipt-pdf-api-cpf-cnpj
currency: USD
billing:
  processor: RapidAPI
  model: subscription with monthly document quota
  self_serve: true
  card_required_for_free_tier: false
  overage: >-
    Overage rates and current terms are published on the RapidAPI listing; not restated here
    because RapidAPI is the source of truth and can change them.
plans:
  - id: faturapdf-basic-free
    name: Basic (free)
    type: free
    price: 0
    timeFrame: month
    description: >-
      20 documents/month, no credit card. The provider states this is enough to integrate and
      test end to end.
    entries:
      - {label: Documents generated, name: documents, type: metered, metric: document, limit: 20, timeFrame: month}
    url: https://rapidapi.com/leosanchees2014/api/brazilian-invoice-receipt-pdf-api-cpf-cnpj
  - id: faturapdf-pro
    name: Pro
    type: subscription
    price: 12.99
    timeFrame: month
    description: 500 documents/month.
    entries:
      - {label: Documents generated, name: documents, type: metered, metric: document, limit: 500, timeFrame: month}
    url: https://rapidapi.com/leosanchees2014/api/brazilian-invoice-receipt-pdf-api-cpf-cnpj
  - id: faturapdf-business
    name: Business
    type: subscription
    price: 24.99
    timeFrame: month
    description: 3,000 documents/month.
    entries:
      - {label: Documents generated, name: documents, type: metered, metric: document, limit: 3000, timeFrame: month}
    url: https://rapidapi.com/leosanchees2014/api/brazilian-invoice-receipt-pdf-api-cpf-cnpj
  - id: faturapdf-enterprise
    name: Enterprise
    type: subscription
    price: 59.99
    timeFrame: month
    description: >-
      15,000 documents/month. Named Enterprise on the listing, but it is a volume tier — there is
      no SLA, no support commitment and no contract behind it.
    entries:
      - {label: Documents generated, name: documents, type: metered, metric: document, limit: 15000, timeFrame: month}
    url: https://rapidapi.com/leosanchees2014/api/brazilian-invoice-receipt-pdf-api-cpf-cnpj
