      - {name: message, type: string, note: human-readable PT-BR, never a stack trace}
  - name: PdfDocument
    schema: 'binary (application/pdf)'
    domain: documents
    description: >-
      The 200 response body — raw PDF bytes, typically ~9 KB for a one-page invoice. Not a
