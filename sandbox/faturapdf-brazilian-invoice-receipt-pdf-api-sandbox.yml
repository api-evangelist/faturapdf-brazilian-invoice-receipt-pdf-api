generated: '2026-08-09'
method: searched
source: >-
  https://faturapdf.com/cpf-cnpj.html, https://faturapdf.com/gerador.html,
  https://faturapdf.com/health, https://faturapdf.com/terms/,
  https://faturapdf.com/.well-known/api-onboarding and the examples published in
  https://faturapdf.com/openapi.yaml. Probed 2026-08-09.
description: >-
  There is no separate test-mode key or sandbox host — the same key and the same endpoint
  serve every call. What the provider does publish instead is a genuinely usable test path:
  a free tier that needs no card, a public unmetered health probe, a browser build of the
  identical rendering code that requires no key at all, and a generator of synthetic
  check-digit-valid CPF/CNPJ so nobody has to test with a real person's document.
test_vs_live:
  separate_modes: false
  key_prefixes: none — one X-RapidAPI-Key, issued by RapidAPI, works for every plan
  free_tier: 20 documents/month, no credit card required (Basic plan)
  note: >-
    Integration testing is expected to run against the live endpoint on the free plan. The
    onboarding descriptor states the free plan is "enough to integrate and test end to end".
unmetered_endpoints:
  - path: /health
    url: https://faturapdf.com/health
    auth: none
    metered: false
    verified: '2026-08-09 — HTTP 200 {"ok":true,"service":"invoice-api (netlify adapter)","tipos":["fatura","recibo"]}'
    note: Public, unauthenticated, explicitly free to poll and not counted as billed usage.
keyless_equivalents:
  - name: Free browser generator
    url: https://faturapdf.com/gerador.html
    description: >-
      Runs the identical validation and layout logic as the API, bundled for the browser.
      No signup, no key, nothing sent to any server. The right way to eyeball output before
      spending quota.
  - name: CPF/CNPJ generator & validator
    url: https://faturapdf.com/cpf-cnpj.html
    description: >-
      Generates check-digit-valid synthetic CPF/CNPJ for system testing and validates/formats
      existing ones. Runs entirely client-side.
  - name: PIX BR Code generator
    url: https://faturapdf.com/pix.html
    description: Builds a PIX "copia e cola" EMV BR Code and QR from your own key, client-side.
synthetic_test_documents:
  policy: >-
    The provider's security.txt asks that reports never include real personal data (CPF, CNPJ,
    names) and points at the generator for synthetic, check-digit-valid documents. All published
    samples use fictitious companies and synthetic numbers.
  generator: https://faturapdf.com/cpf-cnpj.html
  published_values:
    note: >-
      These are the fictitious values the provider ships in its own OpenAPI examples, guides and
      onboarding descriptor. They are synthetic and check-digit valid — saved verbatim, not invented.
    cnpj:
      - value: '11.222.333/0001-81'
        role: emitente (issuer) in the published /invoice example — "Atlas Solucoes Digitais LTDA"
      - value: '22.333.444/0001-81'
        role: destinatario (customer) in the published /invoice example — "Comercio Silva & Filhos ME"
      - value: '11.222.333/0001-99'
        role: >-
          deliberately BROKEN check digit, used in the guide to demonstrate the 400 invalid_params
          response
    cpf:
      - value: '529.982.247-25'
        role: emitente in the published /receipt example
      - value: '390.533.447-05'
        role: destinatario in the published /receipt example
      - value: '111.111.111-11'
        role: >-
          repeated-digit trap in the published 400 example — passes naive mod-11 arithmetic and is
          still rejected
    pix_br_code:
      - value: '00020126580014BR.GOV.BCB.PIX...'
        role: >-
          truncated placeholder BR Code shown on the landing page; the full worked example in the
          Node guide ends in 6304XXXX with the CRC deliberately masked
sample_output:
  note: Generated by the same code path the API runs — published for inspection, not mockups.
  files:
    - url: https://faturapdf.com/samples/fatura-exemplo.pdf
      description: Invoice with CNPJ issuer and recipient, four line items, discount, BRL total, amount in words, PIX QR
    - url: https://faturapdf.com/samples/recibo-exemplo.pdf
      description: Receipt with the "Recebemos de ..." statement line, amount in words, signature line
    - url: https://faturapdf.com/samples/preview-fatura.png
      description: Rendered preview image of the first page at 150 dpi
fixtures_and_triggers:
  test_clock: false
  webhook_triggers: false
  fixture_cli: false
  note: >-
    No time simulation, no event triggers, no fixture tooling — none of which apply to a
    stateless synchronous document renderer. The one time-dependent behaviour is documented:
    omit `data` and the server stamps today, so pin `data` for reproducible output.
failure_simulation:
  - trigger: send a CPF/CNPJ with a wrong check digit
    result: 400 invalid_params, message names the offending party and every other failure at once
  - trigger: send a GET to /invoice or /receipt
    result: 405 method_not_allowed
  - trigger: exceed ~200 KB of JSON or 200 line items
    result: 413 payload_too_large
  - trigger: call https://faturapdf.com/invoice directly instead of the gateway
    result: 401 {"error":"unauthorized"}
