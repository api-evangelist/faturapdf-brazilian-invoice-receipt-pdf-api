name: FaturaPDF — Brazilian Invoice & Receipt PDF API
description: >-
  HTTP API that converts a JSON payload into a Brazilian invoice (fatura) or receipt (recibo) PDF. Fiscal-native
  features include mod-11 checksum-validated CPF/CNPJ, BRL formatting (R$ 1.234,56 computed in integer cents),
  DD/MM/AAAA dates, the total spelled out in Portuguese, and optional rendering of a caller-supplied PIX BR Code as a
  scannable QR. Rendered with a pure-JS engine (pdf-lib), no headless browser. Explicitly NOT an NF-e/NFS-e fiscal
  issuer — it produces a formatted commercial document, not a tax-authority-authorized record. Consumed through the
  RapidAPI gateway (the origin host is not directly callable) and metered per document, with a free tier of 20
  documents a month and no credit card. The provider also publishes free, keyless, client-side tools: an
  invoice/receipt generator, a CPF/CNPJ generator-validator and a PIX BR Code builder, two of them embeddable as
  iframes.
